name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html style.css app.js stations-za.json manifest.json sw.js version.json icon-192.png icon-512.png www/

      - name: Install Capacitor
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          # load the Capacitor runtime in the APK so the app can talk to the native radio service
          if [ -f node_modules/@capacitor/core/dist/capacitor.js ]; then
            cp node_modules/@capacitor/core/dist/capacitor.js www/
            sed -i 's#<script src="app.js"></script>#<script src="capacitor.js"></script>\n<script src="app.js"></script>#' www/index.html
          fi

      - name: Create Android project
        run: |
          npx cap add android
          pip install pillow --quiet || true
          python3 native/patch.py
          npx cap sync android

      - name: Use the app's permanent signing key (so updates install over the old app)
        env:
          KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEY" ]; then
            echo "$KEY" | base64 -d > ~/.android/debug.keystore
            echo "Using the permanent signing key"
          else
            echo "::warning::Secret ANDROID_DEBUG_KEYSTORE is not set - this APK gets a random key and will not install over the old app"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../RetroRadio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RetroRadio-apk
          path: RetroRadio.apk

      - name: Read version
        id: ver
        run: echo "v=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")" >> $GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}-build${{ github.run_number }}
          name: Retro Radio ${{ steps.ver.outputs.v }} (build ${{ github.run_number }})
          body: Download RetroRadio.apk below and open it on your Android phone to install or update.
          files: RetroRadio.apk
          make_latest: true
